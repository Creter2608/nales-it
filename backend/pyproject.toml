[tool.poetry]
name = "nales-it-backend"
version = "0.1.0"
description = "Backend for Nales-It AI Quiz Generator"
authors = ["Nales-It Team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.23.2"}
pydantic = "^2.4.2"
pydantic-settings = "^2.0.3"
motor = "^3.3.1"
pymupdf = "^1.23.5"
langchain = "^0.0.330"
openai = "^1.1.0"
python-multipart = "^0.0.6"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.2"
black = "^23.9.1"
isort = "^5.12.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

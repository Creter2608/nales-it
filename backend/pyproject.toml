[tool.poetry]
name = "nales-it-backend"
version = "0.1.0"
description = "Backend for Nales-It AI Quiz Generator"
authors = ["Nales-It Team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.138.0"
uvicorn = {extras = ["standard"], version = "^0.49.0"}
pydantic = "^2.4.2"
pydantic-settings = "^2.0.3"
motor = "^3.3.1"
pymupdf = "^1.23.5"
langchain = ">=0.2.0"
langchain-core = ">=0.2.0"
langchain-google-genai = ">=1.0.5"
openai = ">=1.1.0"
python-multipart = "^0.0.32"
dnspython = "^2.8.0"
jinja2 = "^3.1.6"
opendataloader-pdf = {extras = ["hybrid"], version = "^2.4.7"}
langchain-openai = "^1.3.3"
json-repair = "^0.61.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
black = "^23.9.1"
isort = "^5.12.0"
pytest-asyncio = "^1.4.0"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
